<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<!-- הגדרות מסך מלא לאנדרואיד / Chrome -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">

  <!-- הגדרות מסך מלא לאייפון / Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="סוכנים">
  
  <title>פורטל סוכנים - מעקב והערות</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .status-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 700;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

  <!-- ========================================== -->
  <!-- 1. מסך כניסה מאובטח -->
  <!-- ========================================== -->
  <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-sm border border-slate-200">
      <div class="text-center mb-6">
        <div class="w-14 h-14 bg-blue-600 text-white text-3xl rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-md">
          🔒
        </div>
        <h2 class="text-lg font-bold text-slate-800">כניסה לאזור אישי</h2>
        <p class="text-xs text-slate-500 mt-1">תיק מעקב הזמנות לסוכנים</p>
      </div>

      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">מספר סוכן (Agent ID):</label>
          <input type="text" id="loginAgentId" required inputmode="numeric" placeholder="לדוגמה: 1234"
            class="w-full text-sm p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none font-mono" />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">סיסמה אישית:</label>
          <input type="password" id="loginPassword" required placeholder="הזן סיסמה..."
            class="w-full text-sm p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" />
        </div>

        <button type="submit" id="btnLogin"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-sm transition shadow-sm flex items-center justify-center gap-1.5 active:scale-95">
          <span>התחבר למערכת</span>
        </button>

        <p id="loginError" class="text-rose-600 text-xs text-center font-bold hidden"></p>
      </form>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- 2. אזור אישי של הסוכן (מוסתר עד התחברות) -->
  <!-- ========================================== -->
  <div id="agentDashboard" class="hidden flex-col min-h-screen pb-20">

    <!-- סרגל עליון מקובע לסמארטפון -->
    <header class="sticky top-0 z-30 bg-white border-b border-slate-200 px-4 py-3 shadow-xs">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-2">
          <div class="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center text-white text-lg shadow-inner">
            👤
          </div>
          <div>
            <div class="flex items-center gap-1.5">
              <h1 id="dashAgentTitle" class="text-sm font-bold text-slate-800 leading-tight">תיק הזמנות סוכן</h1>
              <span id="dashAgentBadge" class="bg-blue-100 text-blue-800 font-mono text-[11px] font-bold px-1.5 py-0.2 rounded"></span>
            </div>
            <p id="agentHeaderSubtitle" class="text-[11px] text-slate-500 font-medium">טוען נתוני סוכן...</p>
          </div>
        </div>

        <div class="flex items-center gap-1.5">
          <button id="btnManualSync" onclick="manualSync()"
            class="p-2 bg-blue-50 text-blue-600 rounded-lg text-xs font-bold flex items-center gap-1 active:bg-blue-100 border border-blue-100 transition shadow-xs">
            <span id="syncIcon">⟳</span>
            <span>רענון</span>
          </button>
          <button onclick="logout()"
            class="p-2 bg-rose-50 text-rose-600 rounded-lg text-xs font-bold active:bg-rose-100 border border-rose-100 transition shadow-xs" title="התנתק">
            <span>יציאה</span>
          </button>
        </div>
      </div>

      <!-- כפתורי סינון מהיר לפי שלבי טיפול -->
      <div class="flex gap-1.5 overflow-x-auto pt-2 pb-0.5 no-scrollbar text-xs">
        <button onclick="setStatusFilter('all')" class="status-btn px-2.5 py-1 rounded-md font-bold whitespace-nowrap bg-slate-800 text-white" data-status="all">הכל</button>
        <button onclick="setStatusFilter('new')" class="status-btn px-2.5 py-1 rounded-md font-bold whitespace-nowrap bg-white text-pink-700 border border-pink-200" data-status="new">חדשות</button>
        <button onclick="setStatusFilter('picking')" class="status-btn px-2.5 py-1 rounded-md font-bold whitespace-nowrap bg-white text-purple-700 border border-purple-200" data-status="picking">בליקוט</button>
        <button onclick="setStatusFilter('agent_wait')" class="status-btn px-2.5 py-1 rounded-md font-bold whitespace-nowrap bg-white text-amber-700 border border-amber-200" data-status="agent_wait">ממתין לסוכן</button>
        <button onclick="setStatusFilter('packing')" class="status-btn px-2.5 py-1 rounded-md font-bold whitespace-nowrap bg-white text-sky-700 border border-sky-200" data-status="packing">במעבדה</button>
        <button onclick="setStatusFilter('ready')" class="status-btn px-2.5 py-1 rounded-md font-bold whitespace-nowrap bg-white text-amber-700 border border-amber-200" data-status="ready">למשלוח</button>
        <button onclick="setStatusFilter('done')" class="status-btn px-2.5 py-1 rounded-md font-bold whitespace-nowrap bg-white text-emerald-700 border border-emerald-200" data-status="done">לחיוב</button>
      </div>
    </header>

    <!-- רשימת ההזמנות המוצגת לגובה -->
    <main class="p-3 space-y-3 flex-1" id="ordersContainer">
      <div class="text-center py-12 text-slate-400 text-xs flex items-center justify-center gap-2">
        <span class="animate-spin text-sm">⟳</span> טוען הזמנות...
      </div>
    </main>

  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyaofJk6FM7_Cu7ZS7v2m4HwLST0cp-0mJy_N13X05Qzsup48q2t-miUvLGLcflCLVl/exec';
    const SYSTEM_KEY = 'Ladlite2026Secure!';

    const STATUS_MAP = {
      new: { title: 'הזמנה חדשה', border: 'border-pink-300', badgeBg: 'bg-pink-100 text-pink-800' },
      picking: { title: 'בליקוט', border: 'border-purple-300', badgeBg: 'bg-purple-100 text-purple-800' },
      agent_wait: { title: 'ממתין לסוכן', border: 'border-amber-400', badgeBg: 'bg-amber-100 text-amber-800' },
      packing: { title: 'במעבדה', border: 'border-sky-300', badgeBg: 'bg-sky-100 text-sky-800' },
      ready: { title: 'מוכן למשלוח', border: 'border-amber-300', badgeBg: 'bg-amber-100 text-amber-800' },
      done: { title: 'מוכן לחיוב', border: 'border-emerald-300', badgeBg: 'bg-emerald-100 text-emerald-800' }
    };

    let targetAgentId = '';
    let currentAgent = { id: '', name: 'סוכן', phone: '' };
    let orders = [];
    let currentStatusFilter = 'all';

    function calculateDaysPassed(dateString) {
      if (!dateString) return 0;
      const created = new Date(dateString);
      const now = new Date();
      const diffTime = Math.abs(now - created);
      return Math.floor(diffTime / (1000 * 60 * 60 * 24));
    }

    function hasUnreadComments(order) {
      if (!order || !order.comments) return false;
      let currentCount = 0;
      if (Array.isArray(order.comments)) {
        currentCount = order.comments.length;
      } else if (typeof order.comments === 'string' && order.comments.trim() !== '') {
        currentCount = 1;
      }
      if (currentCount === 0) return false;
      
      const readCount = parseInt(localStorage.getItem(`read_comments_agent_${order.id}`) || '0', 10);
      return currentCount > readCount;
    }

    function markCommentsAsRead(orderId) {
      const order = orders.find(o => String(o.id) === String(orderId));
      if (!order) return;
      let currentCount = 0;
      if (Array.isArray(order.comments)) {
        currentCount = order.comments.length;
      } else if (typeof order.comments === 'string' && order.comments.trim() !== '') {
        currentCount = 1;
      }
      localStorage.setItem(`read_comments_agent_${orderId}`, currentCount);
    }

    // אימות כניסה מאובטח מול השרת
    async function handleLogin(e) {
      e.preventDefault();
      const inputId = document.getElementById('loginAgentId').value.trim();
      const inputPass = document.getElementById('loginPassword').value.trim();
      const errEl = document.getElementById('loginError');
      const btn = document.getElementById('btnLogin');

      errEl.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = 'מאמת נתונים...';

      try {
        // שליחת הסיסמה לאימות בצד השרת בלבד
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'agentLogin',
            agentId: inputId,
            password: inputPass
          })
        });

        const data = await res.json();

        if (data.success && data.agent) {
          targetAgentId = String(data.agent.id).trim();
          currentAgent = data.agent;

          // שמירה בזיכרון הדפדפן כדי לא להתנתק ברענון
          sessionStorage.setItem('agent_session', JSON.stringify({
            id: targetAgentId,
            pass: inputPass
          }));

          // אם השרת כבר החזיר את ההזמנות, אפשר להשתמש בהן ישירות
          if (data.orders && typeof renderOrders === 'function') {
            renderOrders(data.orders);
          }

          showPortal();
        } else {
          errEl.textContent = data.error || 'מספר סוכן או סיסמה שגויים';
          errEl.classList.remove('hidden');
        }
      } catch (err) {
        console.error('שגיאה באימות סוכן:', err);
        errEl.textContent = 'שגיאת תקשורת בשרת';
        errEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'התחבר למערכת';
      }
    }

    function showPortal() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('agentDashboard').classList.remove('hidden');
      document.getElementById('agentDashboard').classList.add('flex');

      document.getElementById('dashAgentBadge').textContent = `ID: ${targetAgentId}`;
      document.getElementById('agentHeaderSubtitle').textContent = `${currentAgent.name} | ${currentAgent.phone || 'ללא נייד'}`;

      loadOrdersFromServer();
    }

    // טעינת ההזמנות שעובדת פיקס - מסוננת עבור הסוכן שהתחבר
    async function loadOrdersFromServer() {
      try {
        const res = await fetch(`${API_URL}?key=${SYSTEM_KEY}`);
        const data = await res.json();
        const allOrders = data.orders || [];

        // סינון קשיח לפי הסוכן המחובר
        orders = allOrders.filter(o => 
          String(o.agentId || '').trim() === targetAgentId && 
          o.status !== 'archived'
        );

        renderList();
      } catch (err) {
        console.error('שגיאה בטעינת הזמנות:', err);
        document.getElementById('ordersContainer').innerHTML = 
          '<div class="text-center py-10 text-rose-500 text-xs font-bold">שגיאה בטעינת הנתונים מהשרת</div>';
      }
    }

    function setStatusFilter(status) {
      currentStatusFilter = status;
      document.querySelectorAll('.status-btn').forEach(b => {
        const isMatch = b.dataset.status === status;
        b.className = isMatch 
          ? 'status-btn px-2.5 py-1 rounded-md font-bold whitespace-nowrap bg-slate-800 text-white'
          : 'status-btn px-2.5 py-1 rounded-md font-bold whitespace-nowrap bg-white text-slate-600 border border-slate-200';
      });
      renderList();
    }

function renderList() {
      const container = document.getElementById('ordersContainer');

      let filtered = orders
        .filter(o => currentStatusFilter === 'all' || o.status === currentStatusFilter)
        .sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt)); // FIFO

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-slate-400 text-xs">
            <span class="text-2xl block mb-1">📭</span>
            אין הזמנות תואמות כרגע עבור סוכן ${targetAgentId}
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(order => {
        const stInfo = STATUS_MAP[order.status] || { title: order.status, border: 'border-slate-200', badgeBg: 'bg-slate-100 text-slate-700' };
        const days = calculateDaysPassed(order.createdAt);
        const commentsCount = Array.isArray(order.comments) ? order.comments.length : (order.comments ? 1 : 0);
        
        // בדיקת הערה חדשה שלא נקראה
        const hasUnread = typeof hasUnreadComments === 'function' ? hasUnreadComments(order) : false;
        const cardBorder = hasUnread ? 'border-rose-500 ring-2 ring-rose-300' : stInfo.border;
        const unreadBadge = hasUnread ? '<span class="bg-rose-500 text-white font-bold text-[10px] px-1.5 py-0.5 rounded-full animate-pulse">הערה חדשה!</span>' : '';

        return `
          <div class="bg-white rounded-xl border-2 ${cardBorder} shadow-xs overflow-hidden transition">
            
            <!-- ראש הכרטיס -->
            <div class="p-3 bg-white">
              <div class="flex items-center justify-between mb-1.5">
                <div class="flex items-center gap-1.5">
                  <span class="font-mono font-bold text-xs bg-slate-100 px-1.5 py-0.5 rounded text-slate-700">#${order.id}</span>
                  <span class="status-badge ${stInfo.badgeBg}">${stInfo.title}</span>
                  ${unreadBadge}
                </div>
                <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full ${days >= 3 ? 'bg-rose-100 text-rose-700' : 'bg-slate-100 text-slate-600'}">
                  ${days === 0 ? 'היום' : `${days} ימים`}
                </span>
              </div>
              
              <div class="text-sm font-bold text-slate-900 truncate mb-1">${order.clientName || 'לקוח ללא שם'}</div>
              
              <div class="flex items-center justify-between text-[11px] text-slate-500 pt-1 border-t border-slate-100">
                <span>תאריך: ${order.createdAt ? new Date(order.createdAt).toLocaleDateString('he-IL') : '—'}</span>
                <span>${order.deliveryInfo || ''}</span>
              </div>
            </div>

            <!-- אזור פריטים מרווחית (מתקפל) -->
            <div id="itemsBox-${order.id}" class="hidden bg-slate-50 border-t border-b border-slate-100 p-2 text-xs">
              <div class="text-[10px] font-bold text-slate-500 mb-1 flex justify-between items-center">
                <span>פריטים בהזמנה מרווחית:</span>
                <span id="itemsLoader-${order.id}" class="hidden text-blue-600 animate-spin">⟳</span>
              </div>
              <div id="itemsContent-${order.id}" class="space-y-1"></div>
            </div>

            <!-- אזור הערות למחסן (מתקפל) -->
            <div id="commentsBox-${order.id}" class="hidden bg-amber-50/50 border-t border-b border-amber-200 p-3 text-xs">
              <div class="font-bold text-slate-700 mb-2 flex items-center justify-between">
                <span>💬 הערות ובקשות שינוי למחסן:</span>
                <span class="text-[10px] text-slate-400">מופיע מיד בלוח המחסן</span>
              </div>
              
              <div id="commentsList-${order.id}" class="space-y-1.5 max-h-36 overflow-y-auto mb-2.5">
                ${renderOrderCommentsList(order.comments)}
              </div>

              <div class="flex gap-1.5">
                <input type="text" id="commentInput-${order.id}" placeholder="כתוב שינוי/בקשה למחסן..." 
                  class="flex-1 bg-white border border-slate-300 rounded-lg p-2 text-xs outline-none focus:ring-1 focus:ring-blue-500 font-normal" />
                <button onclick="submitAgentComment('${order.id}')" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg font-bold text-xs shrink-0 shadow-xs active:scale-95 transition">
                  שלח
                </button>
              </div>
            </div>

            <!-- פעולות מהירות -->
            <div class="bg-slate-50 px-3 py-2 border-t border-slate-100 flex items-center justify-between gap-2">
              <button onclick="toggleItems('${order.id}')" class="text-xs text-blue-600 font-bold hover:underline flex items-center gap-1">
                <span id="arrow-${order.id}">▼</span> <span>פריטים</span>
              </button>

              <button onclick="toggleComments('${order.id}')" class="bg-white border border-slate-200 hover:border-amber-400 text-slate-700 px-2.5 py-1.5 rounded-lg text-xs font-bold shadow-xs flex items-center gap-1 active:scale-95 transition">
                <span>💬 הערות</span>
                ${commentsCount > 0 ? `<span class="bg-amber-100 text-amber-800 px-1.5 py-0.2 rounded-full text-[10px]">${commentsCount}</span>` : ''}
              </button>
            </div>

          </div>
        `;
      }).join('');
    }

    function renderOrderCommentsList(comments) {
      if (!comments) return '<div class="text-[11px] text-slate-400">אין עדיין הערות להזמנה זו</div>';
      
      let list = [];
      if (Array.isArray(comments)) {
        list = comments;
      } else if (typeof comments === 'string' && comments.trim()) {
        list = [{ author: 'מערכת', time: '', text: comments }];
      }

      if (list.length === 0) return '<div class="text-[11px] text-slate-400">אין עדיין הערות להזמנה זו</div>';

      return list.map(c => `
        <div class="bg-white p-2 rounded-lg border border-slate-200 text-xs shadow-2xs">
          <div class="flex justify-between font-bold text-slate-700 text-[10px] mb-0.5">
            <span>${c.author || 'הערה'}</span>
            <span class="text-slate-400 font-normal">${c.time || ''}</span>
          </div>
          <div class="text-slate-800 font-medium">${c.text}</div>
        </div>
      `).join('');
    }

    function toggleComments(orderId) {
      const box = document.getElementById(`commentsBox-${orderId}`);
      if (!box) return;

      const isHidden = box.classList.contains('hidden');
      box.classList.toggle('hidden');

      // אם פתחנו את תיבת ההערות:
      if (isHidden) {
        // 1. שמירה בזיכרון שההערות נקראו
        markCommentsAsRead(orderId);

        // 2. עדכון ויזואלי של הכרטיס במקום - בלי להרוס את ה-DOM:
        const card = box.closest('.bg-white.rounded-xl');
        if (card) {
          // הסרת המסגרת האדומה
          card.classList.remove('border-rose-500', 'ring-2', 'ring-rose-300');
          // הסרת תגית "הערה חדשה!" המהבהבת אם קיימת
          const unreadBadge = card.querySelector('.animate-pulse');
          if (unreadBadge) unreadBadge.remove();
        }
      }
    }

    async function submitAgentComment(orderId) {
      const input = document.getElementById(`commentInput-${orderId}`);
      const text = input ? input.value.trim() : '';
      if (!text) return;

      const order = orders.find(o => String(o.id) === String(orderId));
      if (!order) return;

      if (!Array.isArray(order.comments)) {
        order.comments = order.comments ? [{ author: 'מערכת', time: '', text: String(order.comments) }] : [];
      }

      const now = new Date();
      const timeStr = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')} ${now.toLocaleDateString('he-IL')}`;

      const newComment = {
        author: `סוכן (${currentAgent.name || targetAgentId})`,
        text: text,
        time: timeStr
      };

      order.comments.push(newComment);
      input.value = '';

      const listContainer = document.getElementById(`commentsList-${orderId}`);
      if (listContainer) {
        listContainer.innerHTML = renderOrderCommentsList(order.comments);
      }
      renderList();

      try {
        const payload = {
          key: SYSTEM_KEY,
          action: 'addComment',
          orderId: String(orderId),
          status: order.status,
          agentName: order.agentName || currentAgent.name,
          agentPhone: order.agentPhone || currentAgent.phone,
          comments: order.comments,
          deliveryInfo: order.deliveryInfo || ''
        };

        const res = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify(payload)
        });

        const result = await res.json();
        if (!result.success) {
          console.warn('השרת לא אישר את שמירת ההערה:', result);
          alert('ההערה לא נשמרה בשרת, נסה שוב');
        }
      } catch (err) {
        console.error('שגיאה בשמירת הערה בשרת:', err);
        alert('שגיאת תקשורת בשמירת ההערה');
      }
    }

    async function toggleItems(orderId) {
      const box = document.getElementById(`itemsBox-${orderId}`);
      const arrow = document.getElementById(`arrow-${orderId}`);
      const content = document.getElementById(`itemsContent-${orderId}`);
      const loader = document.getElementById(`itemsLoader-${orderId}`);
      const order = orders.find(o => String(o.id) === String(orderId));

      if (!box.classList.contains('hidden')) {
        box.classList.add('hidden');
        arrow.textContent = '▼';
        return;
      }

      box.classList.remove('hidden');
      arrow.textContent = '▲';

      if (order.items && order.items.length > 0) {
        renderOrderItems(orderId, order.items);
        return;
      }

      loader.classList.remove('hidden');
      content.innerHTML = '<div class="text-center py-2 text-slate-400">טוען נתונים מרווחית...</div>';

      try {
        const res = await fetch(`${API_URL}?key=${SYSTEM_KEY}&pdfOrderId=${encodeURIComponent(orderId)}`);
        const data = await res.json();
        const doc = data.doc || data;
        const rawItems = doc.items || doc.item_list || (doc.data && (doc.data.item_list || doc.data.items)) || [];
        order.items = rawItems;
        renderOrderItems(orderId, rawItems);
      } catch (err) {
        content.innerHTML = '<div class="text-rose-500 text-[11px]">שגיאה בטעינת הפריטים</div>';
      } finally {
        loader.classList.add('hidden');
      }
    }

    // פונקציית מפתח זהה לחלוטין לזו של המחסן
    function getItemKey(item, idx) {
      const cat = String(item.catalogNum || item.item_id || item.catalog_number || item.id || '').trim();
      if (cat && cat !== '-' && cat !== '0') {
        return `cat_${cat}`;
      }
      const safeName = String(item.name || item.item_name || item.description || 'free_text')
        .trim()
        .slice(0, 20)
        .replace(/\s+/g, '_');
      return `idx_${idx}_${safeName}`;
    }

    function renderOrderItems(orderId, items) {
      const content = document.getElementById(`itemsContent-${orderId}`);
      if (!items || items.length === 0) {
        content.innerHTML = '<div class="text-slate-400 text-[11px]">לא נמצאו פריטים במסמך זה</div>';
        return;
      }

      // חילוץ הסימונים מעמודה M (itemOverrides)
      const order = orders.find(o => String(o.id) === String(orderId));
      let overrides = {};
      if (order && order.itemOverrides) {
        try {
          overrides = typeof order.itemOverrides === 'string' 
            ? JSON.parse(order.itemOverrides) 
            : order.itemOverrides;
        } catch (e) {
          overrides = {};
        }
      }

      content.innerHTML = items.map((it, idx) => {
        const name = it.name || it.item_name || it.description || 'פריט';
        const qty = it.quantity || it.qty || 1;
        const code = String(it.catalogNum || it.item_id || it.catalog_number || '').trim();
        
        // בדיקת המפתח המדויק מול מה שנשמר מהמחסן
        const key = getItemKey(it, idx);
        const overrideData = overrides[key];
        const isCollected = overrideData && overrideData.collected === true;

        // עיצוב שורה: שחור אם נאסף במחסן, לבן רגיל אם טרם
        const rowStyle = isCollected 
          ? 'bg-slate-900 border-slate-950 text-white' 
          : 'bg-white border-slate-200 text-slate-700';

        const nameStyle = isCollected ? '!text-white font-medium' : 'text-slate-800';
        const badgeStyle = isCollected 
          ? 'bg-emerald-500 text-slate-950 font-black' 
          : 'bg-blue-50 text-blue-700 font-bold';

        return `
          <div class="flex justify-between items-center p-2 rounded-lg border transition ${rowStyle}">
            <div class="flex items-center gap-1.5 truncate pr-1">
              ${isCollected ? '<span class="text-emerald-400 text-xs font-bold">✓</span>' : ''}
              <span class="truncate text-xs ${nameStyle}">
                <strong>${code ? code + ' - ' : ''}</strong>${name}
              </span>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              ${isCollected ? '<span class="text-[10px] font-bold text-emerald-400 bg-slate-800 px-1.5 py-0.5 rounded border border-emerald-500/30">נאסף במחסן</span>' : ''}
              <span class="px-1.5 py-0.5 rounded text-[11px] ${badgeStyle}">${qty} יח'</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function logout() {
      sessionStorage.removeItem('agent_session');
      location.reload();
    }

    window.manualSync = async function() {
      const icon = document.getElementById('syncIcon');
      if (icon) icon.classList.add('animate-spin');
      try {
        await loadOrdersFromServer();
      } finally {
        if (icon) setTimeout(() => icon.classList.remove('animate-spin'), 600);
      }
    };

    // בדיקת התחברות קודמת בעת טעינת הדף
    window.addEventListener('DOMContentLoaded', () => {
      const saved = sessionStorage.getItem('agent_session');
      if (saved) {
        const { id, pass } = JSON.parse(saved);
        document.getElementById('loginAgentId').value = id;
        document.getElementById('loginPassword').value = pass;
        handleLogin(new Event('submit'));
      }
    });

    setInterval(loadOrdersFromServer, 5 * 60 * 1000);
  </script>
</body>

</html>
